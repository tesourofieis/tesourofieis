name: merge

on:
  push:
    branches:
      - master

jobs:
  update:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: "🔸 Update Expo App"
        run: npx eas-cli update --auto
