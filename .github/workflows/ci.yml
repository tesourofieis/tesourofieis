name: CI

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: Lint
        run: npm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: Typecheck
        run: npm check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: Test
        run: npm test
