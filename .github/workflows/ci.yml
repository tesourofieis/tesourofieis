name: CI

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: Typecheck
        run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: Test
        run: npm run test

  deploy-web-preview:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup repo
        uses: actions/checkout@v4
      - name: 🏗️ Setup Node
        uses: actions/setup-node@v4
      - name: 🏗️ Install
        run: npm install

      - name: "🔧 Build"
        run: npm run build:web
      - name: "🔸 Cloudflare Workers - Deploy 🚀"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name tesourofieis
