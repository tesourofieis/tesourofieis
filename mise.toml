[tools]
node = "24.11.1"
bun = "1.3.14"
java = "temurin-17.0.16+8"
"npm:eas-cli" = "22.4.0"

[env]
_.file = ".env.local"
ANDROID_HOME = "/opt/android-sdk"
ANDROID_SDK_ROOT = "/opt/android-sdk"
ANDROID_AVD_HOME = "{{env.HOME}}/.config/android/avd"
_.path = [
  "/opt/android-sdk/cmdline-tools/latest/bin",
  "/opt/android-sdk/platform-tools",
  "/opt/android-sdk/emulator",
]

[tasks.setup]
description = "Install the pinned toolchain and project dependencies"
run = ["mise install", "bun install --frozen-lockfile", "bun run hooks:install", "mise run doctor"]

[tasks.doctor]
description = "Check the local Android development environment"
run = "bash scripts/doctor-android.sh"

[tasks.verify]
run = "bun run ci"
